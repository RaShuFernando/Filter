name: Auto Fetch and Filter Zoom/Teams Nodes

on:
  schedule:
    # Runs every 6 hours (at minute 10 of hours 0, 6, 12, 18 UTC)
    - cron: '10 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit and push back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fetch & Filter Script
        run: python fetchfilter.py

      - name: Commit and Push Updated Subscriptions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zoom-teams-sub.txt zoom-teams-sub-b64.txt
          
          # Only commit if changes exist
          git diff --staged --quiet || (git commit -m "Auto-update Zoom/Teams subscription [skip ci]" && git push)
